<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free WiFi</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #07111f, #102b46);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.screen {
  display: none;
  animation: appear 0.6s ease;
}

.screen.active {
  display: block;
}

.wifi-icon {
  font-size: 75px;
  margin-bottom: 20px;
}

h1 {
  font-size: 38px;
  letter-spacing: 3px;
  margin-bottom: 12px;
}

p {
  color: #cbd5e1;
  line-height: 1.6;
  margin-bottom: 28px;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #0ea5e9;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:active {
  transform: scale(0.96);
}

button:hover {
  background: #0284c7;
}

.photo-box {
  padding: 12px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 18px;
  margin-bottom: 22px;
}

.photo-box img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 12px;
}

.back-btn {
  margin-top: 12px;
  background: #243b53;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- First Screen -->
  <section id="home" class="screen active">
    <div class="wifi-icon">📶</div>
    <h1>FREE WiFi</h1>
    <p>
      Welcome!<br>
      Enter to discover something special.
    </p>
    <button onclick="enterWebsite()">
      ENTER NOW →
    </button>
  </section>

  <!-- Image Screen -->
  <section id="gallery" class="screen">
    <h1 style="font-size:28px;">WELCOME ❤️</h1>
    <p>Your special image is waiting for you.</p>

    <div class="photo-box">
      <!-- Replace my-image.jpg with your image filename -->
      <img src="my-image.jpeg"
           alt="My uploaded image"
           onerror="this.style.display='none'; document.getElementById('imageError').style.display='block';">

      <p id="imageError"
         style="display:none; margin:12px 0;">
        Image not found! Please add my-image.jpg
        to the same folder.
      </p>
    </div>

    <button class="back-btn" onclick="goBack()">
      ← GO BACK
    </button>
  </section>

</div>

<script>
function enterWebsite() {
  document.getElementById("home").classList.remove("active");
  document.getElementById("gallery").classList.add("active");
}

function goBack() {
  document.getElementById("gallery").classList.remove("active");
  document.getElementById("home").classList.add("active");
}
</script>

</body>
</html>
